name: Performance Benchmarks

on:
  # Run on pushes to main/master branch
  push:
    branches: [ main, master ]
  # Run on PRs to main/master branch
  pull_request:
    branches: [ main, master ]
  # Allow manual triggering
  workflow_dispatch:

jobs:
  benchmark:
    name: Run performance benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for comparing with baseline

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-benchmark spacy
          python -m spacy download en_core_web_sm

      - name: Run benchmarks
        run: |
          python scripts/run_benchmarks.py --verbose

      - name: Check for performance regression
        run: |
          python scripts/run_benchmarks.py --skip-comparison --threshold mean+10% --name ci_run
          # Store benchmark result in artifacts
          mkdir -p benchmark-results
          cp -r .benchmarks/* benchmark-results/ || true
          cp results/benchmarks/* benchmark-results/ || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: benchmark-results/

      - name: Comment benchmark results on PR
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const csvFile = 'results/benchmarks/benchmark_comparison.csv';
              if (fs.existsSync(csvFile)) {
                const csvData = fs.readFileSync(csvFile, 'utf8');
                const rows = csvData.split('\n')
                  .filter(row => row.trim() !== '')
                  .map(row => row.split(','));

                // Format as markdown table
                let markdownTable = '## Benchmark Results\n\n';
                markdownTable += '| Test | Old Time (s) | New Time (s) | Change |\n';
                markdownTable += '|------|-------------|-------------|--------|\n';

                for (let i = 1; i < rows.length; i++) {
                  const [name, oldTime, newTime, diff] = [rows[i][0], rows[i][1], rows[i][2], rows[i][3]];
                  markdownTable += `| ${name} | ${oldTime} | ${newTime} | ${diff} |\n`;
                }

                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: markdownTable
                });
              } else {
                console.log('No benchmark comparison CSV found');
              }
            } catch (error) {
              console.log(`Error creating benchmark comment: ${error}`);
            }
