<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ table_name }} Table View</title>
    <link rel="stylesheet" href="{{ url_for('styles') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>{{ table_name }} Table View</h1>
    <table id="table-view">
        <thead>
            <tr>
                {% for column in columns %}
                <th>{{ column }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                {% for column in columns %}
                <td>{{ row[column] }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <button id="load-more">Load More</button>
    <script>
        $(document).ready(function() {
            let page = {{ page }};
            const perPage = 30;

            function loadTableData() {
                $.getJSON(`/tables/{{ table_name }}?page=${page}&per_page=${perPage}`, function(data) {
                    const tbody = $('#table-view tbody');
                    data.rows.forEach(row => {
                        const tr = $('<tr>');
                        data.columns.forEach(column => {
                            tr.append($('<td>').text(row[column]));
                        });
                        tbody.append(tr);
                    });
                    if (!data.has_more) {
                        $('#load-more').hide();
                    }
                });
            }

            $('#load-more').click(function() {
                page++;
                loadTableData();
            });

            // Initial load
            loadTableData();
        });
    </script>
</body>
</html>
