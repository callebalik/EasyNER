{% extends "base.html" %}

{% block title %}Raw Entity Co-occurrences{% endblock %}

{% block content %}
    <h1>Raw Entity Co-occurrences</h1>
    <div id="table-view" class="view">
        <table class="cooccurrences-table">
            <thead>
                <tr>
                    <th>Entity 1</th>
                    <th>Entity 2</th>
                    <th>Document ID</th>
                    <th>Sentence</th>
                    <th>Distance</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            let currentPage = 1;

            function loadTable(page) {
                $.get('/raw-cooccurrences/table', { page: page }).done(function(data) {
                    const tbody = $('.cooccurrences-table tbody');

                    if (page === 1) {
                        tbody.empty();
                    }

                    data.cooccurrences.forEach(cooc => {
                        tbody.append(
                            $('<tr>').append(
                                $('<td>').append(
                                    $('<span>')
                                        .text(cooc.entity1_text)
                                        .attr('title', `ID: ${cooc.e1_id}`)
                                ),
                                $('<td>').append(
                                    $('<span>')
                                        .text(cooc.entity2_text)
                                        .attr('title', `ID: ${cooc.e2_id}`)
                                ),
                                $('<td>').append(
                                    $('<a>')
                                        .attr('href', '/document/' + cooc.document_id)
                                        .text(cooc.document_id)
                                ),
                                $('<td>').text(cooc.sentence_index),
                                $('<td>').text(cooc.sentence_distance || 'N/A')
                            )
                        );
                    });

                    $('.load-more-button').remove();
                    if (data.has_more) {
                        $('#table-view').append(
                            $('<button>')
                                .addClass('load-more-button')
                                .text('Load More')
                                .click(() => loadTable(page + 1))
                        );
                    }
                });
            }

            // Initial load
            loadTable(currentPage);
        });
    </script>
{% endblock %}
