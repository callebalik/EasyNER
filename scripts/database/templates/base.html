<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %} - EasyNer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="nav">
        <div class="nav-content">
            <div class="nav-left">
                <div class="nav-group">
                    <a href="{{ url_for('home') }}">Home</a>
                    <a href="{{ url_for('health_check') }}">Health Check</a>
                </div>
                <div class="nav-group">
                    <a href="{{ url_for('list_documents') }}">Documents</a>
                    <a href="{{ url_for('list_named_entities') }}">Named Entities</a>
                </div>
                <div class="nav-group">
                    <a href="{{ url_for('list_entity_occurrences') }}">Entity Occurrences</a>
                    <a href="{{ url_for('list_aggregated_entity_occurrences') }}">Aggregated Entity Occurrences</a>
                </div>
                <div class="nav-group">
                    <a href="{{ url_for('raw_cooccurrences') }}">Raw Co-occurrences</a>
                    <a href="{{ url_for('summary_cooccurrences') }}">Summary Co-occurrences</a>
                </div>
                <div class="nav-group">
                    <a href="{{ url_for('show_tables') }}">Tables</a>
                    <a href="{{ url_for('show_indexes') }}">Indexes</a>
                    <a href="{{ url_for('show_views') }}">Views</a>
                </div>
                <a href="{{ url_for('disease_phenomena_sankey') }}">Disease-Phenomena Sankey</a>
            </div>
            <div class="nav-right">
                <button onclick="openQueryModal()" class="query-button">SQL Query</button>
            </div>
        </div>
    </div>

    <!-- Query Modal -->
    <div id="queryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>SQL Query</h2>
                <span class="close" onclick="closeQueryModal()">&times;</span>
            </div>
            <div class="modal-body">
                <textarea id="queryInput" placeholder="Enter your SELECT query here..." rows="6"></textarea>
                <button onclick="executeQuery()" class="action-button">Execute Query</button>
            </div>
            <div id="queryResult" class="query-result">
                <div id="queryMessage"></div>
                <div id="queryTable" style="overflow-x: auto;"></div>
            </div>
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <style>
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
        background-color: white;
        margin: 5% auto;
        padding: 20px;
        border-radius: 8px;
        width: 80%;
        max-width: 1200px;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .close {
        color: #aaa;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }

    .close:hover {
        color: #555;
    }

    #queryInput {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-family: monospace;
        resize: vertical;
    }

    .query-result {
        margin-top: 20px;
        max-height: 50vh;
        overflow-y: auto;
    }

    #queryMessage {
        margin: 10px 0;
        padding: 10px;
        border-radius: 4px;
    }

    #queryMessage.error {
        background-color: #fee;
        color: #c33;
        border: 1px solid #fcc;
    }

    #queryMessage.success {
        background-color: #efe;
        color: #3c3;
        border: 1px solid #cfc;
    }

    .query-button {
        background: #4CAF50;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        height: fit-content;  /* Ensure button height is based on content */
        margin: auto 0;      /* Center vertically */
    }

    .query-button:hover {
        background: #45a049;
    }

    #queryTable table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    #queryTable th, #queryTable td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
    }

    #queryTable th {
        background-color: #f5f5f5;
        font-weight: bold;
    }

    #queryTable tr:nth-child(even) {
        background-color: #f9f9f9;
    }

    .nav {
        background-color: #2196f3;  /* Using direct color instead of variable */
        padding: 1rem;
        margin: -20px -20px 2rem -20px;
        color: white;
    }

    .nav-content {
        display: flex;
        justify-content: space-between;
        align-items: center;  /* Changed from flex-start to center */
        max-width: 1200px;
        margin: 0 auto;
        min-height: 50px;  /* Added minimum height for consistency */
    }

    .nav-left {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        flex: 1;
    }

    .nav-right {
        padding-left: 1rem;
        display: flex;
        align-items: center;
        align-self: stretch;  /* Make it stretch to nav height */
    }

    .nav-group {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        padding: 0.5rem;
        background: rgba(255,255,255,0.05);
        border-radius: 6px;
        min-width: 200px;
    }
    </style>

    <script>
    function openQueryModal() {
        document.getElementById('queryModal').style.display = 'block';
        document.getElementById('queryInput').focus();
    }

    function closeQueryModal() {
        document.getElementById('queryModal').style.display = 'none';
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
        if (event.target == document.getElementById('queryModal')) {
            closeQueryModal();
        }
    }

    function executeQuery() {
        const query = document.getElementById('queryInput').value.trim();
        const messageDiv = document.getElementById('queryMessage');
        const tableDiv = document.getElementById('queryTable');

        if (!query) {
            messageDiv.textContent = 'Please enter a query';
            messageDiv.className = 'error';
            return;
        }

        messageDiv.textContent = 'Executing query...';
        messageDiv.className = '';
        tableDiv.innerHTML = '';

        fetch('/execute-query', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ query: query })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                messageDiv.textContent = 'Error: ' + data.error;
                messageDiv.className = 'error';
                return;
            }

            // Create results table
            const table = document.createElement('table');

            // Add headers
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            data.columns.forEach(column => {
                const th = document.createElement('th');
                th.textContent = column;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // Add data rows
            const tbody = document.createElement('tbody');
            data.rows.forEach(row => {
                const tr = document.createElement('tr');
                data.columns.forEach(column => {
                    const td = document.createElement('td');
                    td.textContent = row[column] !== null ? row[column] : 'NULL';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);

            // Show results
            tableDiv.innerHTML = '';
            tableDiv.appendChild(table);

            messageDiv.textContent = `Query returned ${data.rowCount} rows${data.truncated ? ' (limited to 1000 rows)' : ''}`;
            messageDiv.className = 'success';
        })
        .catch(error => {
            messageDiv.textContent = 'Error executing query: ' + error;
            messageDiv.className = 'error';
        });
    }
    </script>
</body>
</html>
