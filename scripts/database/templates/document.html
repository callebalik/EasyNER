{% extends 'base.html' %}

{% block title %}{{ document.title }}{% endblock %}

{% block content %}
    <div class="document-content">
        {{ document.to_html()|safe }}
    </div>
{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const entityElements = document.querySelectorAll('.entity');
        const entityRows = document.querySelectorAll('.entity-table tr[data-entity-id]');

        entityRows.forEach(row => {
            row.addEventListener('mouseover', function() {
                const entityId = this.getAttribute('data-entity-id');
                document.querySelectorAll(`.entity[data-entity-id='${entityId}']`).forEach(el => {
                    el.classList.add('highlighted-entity');
                });
            });
            row.addEventListener('mouseout', function() {
                const entityId = this.getAttribute('data-entity-id');
                document.querySelectorAll(`.entity[data-entity-id='${entityId}']`).forEach(el => {
                    el.classList.remove('highlighted-entity');
                });
            });
        });
    });
</script>
{% endblock %}
